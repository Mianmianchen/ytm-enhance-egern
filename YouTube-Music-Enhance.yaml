name: YouTube Music Enhance - Native UI Stable v2.2
description: 稳定播放版；去除页面及播放响应广告并启用后台播放，保留登录和原生界面
author: Egern adaptation / Maasea upstream transformer
icon: music.note

scriptings:
  # 仅修改 YouTube 自身响应；不接管 googlevideo 媒体初始化请求。
  - http_response:
      name: YTM 播放响应净化
      match: '^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/(?:browse|next|player|get_watch|account\/get_setting)(?:\?.*)?$'
      script_url: 'https://raw.githubusercontent.com/Mianmianchen/ytm-enhance-egern/main/scripts/ytm-response-v2.2.js'
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 30

mitm:
  hostnames:
    includes:
      - youtubei.googleapis.com
      - youtubei-att.googleapis.com
