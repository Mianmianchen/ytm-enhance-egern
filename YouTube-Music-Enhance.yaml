name: YouTube Music Enhance - Native UI Stable v2.4
description: 字节级修复；恢复去广告与后台播放，保留登录、灵动岛、锁屏歌曲信息及原生界面
author: Egern adaptation / Maasea protocol fields
icon: music.note

scriptings:
  - http_response:
      name: YTM 播放去广告与后台播放
      match: '^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/(?:player|get_watch)(?:\?.*)?$'
      script_url: 'https://raw.githubusercontent.com/Mianmianchen/ytm-enhance-egern/main/scripts/ytm-response-v2.4.js'
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 30

  - http_response:
      name: YTM 页面广告与后台播放设置
      match: '^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/(?:browse|next|account\/get_setting)(?:\?.*)?$'
      script_url: 'https://raw.githubusercontent.com/Mianmianchen/ytm-enhance-egern/main/scripts/ytm-response-v2.2.js'
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 30

mitm:
  hostnames:
    includes:
      - youtubei.googleapis.com
      - youtubei-att.googleapis.com
